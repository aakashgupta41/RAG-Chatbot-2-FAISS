[project]
name = "rag-chatbot-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aakashgupta41", email = "aakashguptamdeen41@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pypdf>=7.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
rag-chatbot-2 = "rag_chatbot_2:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
